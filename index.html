<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Niklas König</title>
<meta name="theme-color" content="#111111">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/style.css?v=7">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="star" viewBox="0 0 100 100"><path d="M50 0 C53 34 66 47 100 50 C66 53 53 66 50 100 C47 66 34 53 0 50 C34 47 47 34 50 0Z"/></symbol>
</svg>

<main>

  <!-- ===== Gesicht ===== -->
  <section class="hero">
    <h1 class="name">
      <span>Niklas</span>
      <svg class="name-star" aria-hidden="true"><use href="#star"/></svg>
      <span>König</span>
    </h1>
    <figure class="face">
      <img class="back" src="/img/paper/face-back.webp" width="1200" height="1200" alt="">
      <img class="photo" src="/img/niklas-1400.webp" width="1400" height="1400" alt="Niklas König">
      <img class="window" src="/img/paper/face-window.webp" width="1200" height="1200" alt="">
      <i class="tape masking" style="--l:-4%;--t:5%;--w:26%;--r:-36deg"></i>
    </figure>
  </section>

  <!-- ===== Plakat aus Heftausschnitten ===== -->
  <section class="wheat">
    <div class="poster">
      <img class="poster-back" src="/img/paper/poster-back.webp" width="1300" height="820" alt="">
      <img class="poster-sheet" src="/img/paper/poster.webp" width="1500" height="900" alt="">
      <h2 class="ransom" aria-label="Shoot your shot.">
        <span class="row big" aria-hidden="true">
          <img src="/img/cut/s1.webp" style="--r:-6deg;--y:2%" alt=""><img src="/img/cut/h1.webp" style="--r:3deg;--y:-4%" alt=""><img src="/img/cut/o1.webp" style="--r:-2deg;--y:3%" alt=""><img src="/img/cut/o2.webp" style="--r:5deg;--y:-2%" alt=""><img src="/img/cut/t1.webp" style="--r:-4deg;--y:4%" alt="">
        </span>
        <span class="row small" aria-hidden="true">
          <img src="/img/cut/y1.webp" style="--r:4deg;--y:0" alt=""><img src="/img/cut/o3.webp" style="--r:-5deg;--y:6%" alt=""><img src="/img/cut/u1.webp" style="--r:2deg;--y:-3%" alt=""><img src="/img/cut/r1.webp" style="--r:-3deg;--y:4%" alt="">
        </span>
        <span class="row big" aria-hidden="true">
          <img src="/img/cut/s2.webp" style="--r:3deg;--y:-2%" alt=""><img src="/img/cut/h2.webp" style="--r:-5deg;--y:3%" alt=""><img src="/img/cut/o4.webp" style="--r:4deg;--y:-3%" alt=""><img src="/img/cut/t2.webp" style="--r:-2deg;--y:2%" alt=""><img class="dot" src="/img/cut/dot.webp" style="--r:8deg;--y:34%" alt="">
        </span>
      </h2>
      <i class="tape masking" style="--l:-3%;--t:2%;--w:150px;--r:-34deg"></i>
      <i class="tape masking" style="--l:89%;--t:4%;--w:140px;--r:30deg"></i>
    </div>
  </section>

  <div class="wall">

    <!-- Schilder -->
    <div class="pair">
      <figure class="scrap print trim" style="--c:2/6;--mt:20%;--r:-1.8deg"><img src="/img/svIlYNz19pQ-900.webp" srcset="/img/svIlYNz19pQ-900.webp 900w, /img/svIlYNz19pQ-1800.webp 1800w" sizes="(max-width:760px) 50vw, 34vw" width="900" height="1350" loading="lazy" alt="Silhouette aus den Wörtern Liebe und Hass auf dunklem Grund"><i class="tape masking t"></i></figure>
      <figure class="scrap frame fo" style="--c:7/12;--r:2.4deg"><img src="/img/S_MXibn6oHI-900.webp" srcset="/img/S_MXibn6oHI-900.webp 900w, /img/S_MXibn6oHI-1800.webp 1800w" sizes="(max-width:760px) 50vw, 34vw" width="900" height="1350" loading="lazy" alt="Schild mit der Aufschrift Frit Stop über Schachbrettmuster"></figure>
    </div>

    <!-- Dinge, die sich drehen -->
    <div class="pair quad">
      <figure class="scrap w dogear" style="--c:1/9;--r:1deg"><img src="/img/wWiVD-IsDns-900.webp" srcset="/img/wWiVD-IsDns-900.webp 900w, /img/wWiVD-IsDns-1800.webp 1800w" sizes="(max-width:760px) 100vw, 62vw" width="900" height="675" loading="lazy" alt="Blaue Armbanduhr mit Metallarmband"><i class="tape masking tl"></i></figure>
      <figure class="scrap dots" style="--c:9/13;--mt:9%;--r:2.2deg"><img src="/img/lqy07Ffdkoc-900.webp" srcset="/img/lqy07Ffdkoc-900.webp 900w, /img/lqy07Ffdkoc-1800.webp 1800w" sizes="(max-width:760px) 50vw, 34vw" width="900" height="1200" loading="lazy" alt="Tonbandgerät mit Spulen"><i class="tape orange t"></i></figure>
      <figure class="scrap frame fc" style="--c:2/6;--row:2;--mt:7%;--r:-2.4deg"><img src="/img/yNxP-sdPEx0-900.webp" srcset="/img/yNxP-sdPEx0-900.webp 900w, /img/yNxP-sdPEx0-1800.webp 1800w" sizes="(max-width:760px) 50vw, 34vw" width="900" height="1350" loading="lazy" alt="Flugzeugpropeller im Gegenlicht, schwarzweiß"><i class="tape masking t"></i></figure>
      <figure class="scrap w frame fo" style="--c:7/12;--row:2;--mt:-5%;--r:-3deg;--z:2"><img src="/img/iYcURjI3aZ8-900.webp" srcset="/img/iYcURjI3aZ8-900.webp 900w, /img/iYcURjI3aZ8-1800.webp 1800w" sizes="(max-width:760px) 100vw, 62vw" width="900" height="675" loading="lazy" alt="Euromünze mit Eule auf schwarzem Grund"></figure>
      <i class="cbar" style="right:1%;bottom:8%" aria-hidden="true"></i>
    </div>

    <!-- Autos -->
    <div class="pair">
      <figure class="scrap frame fo" style="--c:1/7;--r:-2deg"><img src="/img/kGuBcBm0E1g-900.webp" srcset="/img/kGuBcBm0E1g-900.webp 900w, /img/kGuBcBm0E1g-1800.webp 1800w" sizes="(max-width:760px) 50vw, 46vw" width="900" height="1200" loading="lazy" alt="Rotes Mustang-Cabrio neben einem grauen Auto"><i class="tape masking t"></i></figure>
      <figure class="scrap trim" style="--c:8/12;--mt:18%;--r:2.4deg"><img src="/img/Gth9FScaFCk-900.webp" srcset="/img/Gth9FScaFCk-900.webp 900w, /img/Gth9FScaFCk-1800.webp 1800w" sizes="(max-width:760px) 50vw, 30vw" width="900" height="1350" loading="lazy" alt="Cadillac-Heckflosse"><i class="tape orange t"></i></figure>
    </div>

    <!-- Fassaden -->
    <div class="pair">
      <figure class="scrap print dots" style="--c:2/5;--r:1.6deg"><img src="/img/XPmTnY4AHtk-900.webp" srcset="/img/XPmTnY4AHtk-900.webp 900w, /img/XPmTnY4AHtk-1800.webp 1800w" sizes="(max-width:760px) 50vw, 23vw" width="900" height="1600" loading="lazy" alt="Tauben auf einem Betondach vor blauem Himmel"><i class="tape orange t"></i></figure>
      <figure class="scrap frame fc" style="--c:6/12;--mt:12%;--r:-1.6deg"><img src="/img/qIIUsbRZCtw-900.webp" srcset="/img/qIIUsbRZCtw-900.webp 900w, /img/qIIUsbRZCtw-1800.webp 1800w" sizes="(max-width:760px) 50vw, 46vw" width="900" height="1200" loading="lazy" alt="Wohnhaus mit roten und weißen Balkonen"><i class="staple" style="left:18%;top:2.4%"></i><i class="staple" style="left:74%;top:2.4%"></i></figure>
      <svg class="reg" style="left:0;bottom:6%" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="11"/><path d="M20 0V40M0 20H40"/></svg>
      <i class="cbar" style="right:0;top:4%" aria-hidden="true"></i>
    </div>

    <!-- Wasser -->
    <div class="pair">
      <figure class="scrap frame fc" style="--c:2/6;--r:-2deg"><img src="/img/wElIrmSa0AU-900.webp" srcset="/img/wElIrmSa0AU-900.webp 900w, /img/wElIrmSa0AU-1800.webp 1800w" sizes="(max-width:760px) 50vw, 34vw" width="900" height="1350" loading="lazy" alt="Gelbe Boje spiegelt sich im ruhigen See"><i class="tape masking t"></i></figure>
      <figure class="scrap w trim" style="--c:7/13;--mt:14%;--r:1.4deg"><img src="/img/tongwU50wgE-900.webp" srcset="/img/tongwU50wgE-900.webp 900w, /img/tongwU50wgE-1800.webp 1800w" sizes="(max-width:760px) 100vw, 54vw" width="900" height="600" loading="lazy" alt="Steg mit Leiter und Tauchverbotsschild am See"><i class="tape masking tl"></i><i class="tape masking tr"></i></figure>
    </div>

    <!-- Finale -->
    <div class="pair finale">
      <figure class="scrap w frame fo" style="--c:2/12;--r:-1deg"><img src="/img/xKY4ZHJDITA-1800.webp" srcset="/img/xKY4ZHJDITA-900.webp 900w, /img/xKY4ZHJDITA-1800.webp 1800w" sizes="(max-width:760px) 100vw, 84vw" width="900" height="600" loading="lazy" alt="Milchstraße über Waldbäumen"><i class="tape masking t"></i></figure>
      <svg class="reg" style="left:1%;bottom:4%" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="11"/><path d="M20 0V40M0 20H40"/></svg>
    </div>

  </div>
</main>

<footer class="foot">
  <span>© <span id="y">2026</span> Niklas König</span>
  <a href="/datenschutz.html">Datenschutz</a>
</footer>

<script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
